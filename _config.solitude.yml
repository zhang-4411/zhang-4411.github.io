# -------------------------------------------
# Hexo Theme Solitude v4 - 站点覆盖配置
# 本文件只需写"与主题默认不同"的项，未写明的项沿用
# node_modules/hexo-theme-solitude/_config.yml 的默认值
# 文档: https://solitude.js.org/cn
# -------------------------------------------

# 站点信息
site:
  name:
    class: text
    custom: 小帅的博客
  icon: /img/pwa/favicon.png

# 导航栏
nav:
  menu:
    首页: /
    文章:
      归档: /archives/ || fas fa-folder-closed
      分类: /categories/ || fas fa-clone
      标签: /tags/ || fas fa-tags
    友链:
      友情链接: /friends/ || fas fa-user-group
    我的:
      关于: /about/ || fas fa-user
      音乐馆: /music/ || fas fa-music

# 首页顶部 Banner
hometop:
  enable: true
  banner:
    title: 分享嵌入式<br >C 与硬件的日常
    desc:
      一个热爱嵌入式开发的程序员 · 今日诗词加载中…
  group:
    标签: /tags/ || fas fa-tags || linear-gradient(to right,#f65,#ffbf37)
  recommendList:
    - order: 1
      sup: 置顶
      title: 在STM32上模拟Linux自动初始化过程
      url: /posts/507015846/
      img: /img/default.avif
      color: "none"

# 侧边栏
aside:
  # 信息卡
  my_card:
    author:
      img: /img/logo.png
    description: 嵌入式 C 开发者，记录调试技巧与框架设计。
    information:
      Github: https://github.com/zhang-4411 || fab fa-github
  # 网站信息（不蒜子未启用，PV/UV 关闭避免显示空值）
  siteinfo:
    postcount: true
    wordcount: true
    pv: false
    uv: false
    updatetime: true
    runtimeenable: true
    runtime: "2022-07-04 00:00:00"

# 文章设置
page:
  # 使用服务端渲染归档列表，避免依赖异步模块导致一直显示加载中
  archives: 1

post:
  meta:
    date: true
    updated: false
    wordcount: true
    readtime: true
  rss: /rss.xml

# 字数统计（依赖 hexo-wordcount，已安装）
wordcount: true

# 主题配色（可改为任意十六进制颜色）
theme_color:
  dark: "#ffc848"
  light: "#425AEF"
  nav_hover_text:
    dark: "#1b1c20"
    light: "#ffffff"

# 代码块高亮
highlight:
  enable: true
  limit: 200
  copy: true
  expand: true
  theme: mac
  color: solidity

# 本地搜索（配合 hexo-generator-search 生成的 search.xml）
search:
  enable: true
  type: local
  local:
    preload: false

# 音乐馆与底部音乐胶囊
music:
  enable: true
  id: 5147459366
  server: netease
  type: playlist
  volume: 0.7
  mutex: true
  order: random

capsule:
  enable: true
  id: 5147459366
  server: netease
  type: playlist
  volume: 0.7

# 图片懒加载
lazyload:
  enable: true
  field: site

# 右下角悬浮按钮（回顶/阅读进度）
rightside:
  enable: true
  percent: true

# 关闭 nib CSS 前缀（IE 已消亡；且 nib 的 opacity() 混入无法处理 var() 变量，
# 会吞掉整个 index.css 的编译产出）
css_prefix: false

# 页脚
footer:
  information:
    author: false
    left:
      Github: https://github.com/zhang-4411 || fab fa-github
  links:
    - name: RSS
      url: /rss.xml

# 兼容旧 Matery 的今日诗词与看板娘
extends:
  head:
    - '<script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>'
    - '<style>.archive-fallback-item{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:10px 0;border:1px solid var(--efu-card-border);border-radius:12px;background:var(--efu-card-bg);transition:transform .2s ease,box-shadow .2s ease}.archive-fallback-item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}.archive-fallback-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--efu-main-op-deep)}.archive-fallback-main{min-width:0}.archive-fallback-title{font-weight:600;color:var(--efu-fontcolor);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.archive-fallback-meta{margin-top:6px;color:var(--efu-secondtext);font-size:.85em}</style>'
  body:
    - '<script>(function(){function init(){if(location.pathname !== "/" || !window.jinrishici){return;}var host=document.querySelector(".banners-title-small");if(!host){return;}host.textContent="正在加载今日诗词…";jinrishici.load(function(result){if(result && result.data){host.textContent=result.data.content+" —— "+result.data.origin;}});}if(document.readyState === "loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}document.addEventListener("pjax:complete",init);})();</script>'
    - '<script>(function(){function render(){var shell=document.getElementById("archives-page"),tpl=document.getElementById("archive-page-data"),list=document.getElementById("archives-page-list");if(!shell||!tpl||!list||list.dataset.fallbackDone==="true"){return;}var posts;try{posts=JSON.parse(tpl.content?tpl.content.textContent:tpl.textContent||"[]");}catch(e){return;}if(!Array.isArray(posts)||!posts.length){return;}list.replaceChildren();posts.forEach(function(post){var a=document.createElement("a");a.className="archive-fallback-item";a.href=post.url;var img=document.createElement("img");img.className="archive-fallback-thumb";img.src=post.cover||"/img/default.avif";img.alt="";var main=document.createElement("div");main.className="archive-fallback-main";var title=document.createElement("div");title.className="archive-fallback-title";title.textContent=post.title||"未命名文章";var meta=document.createElement("div");meta.className="archive-fallback-meta";meta.textContent=(post.primaryCategory||"未分类")+" · "+(post.dateLabel||"");main.append(title,meta);a.append(img,main);list.appendChild(a);});list.dataset.fallbackDone="true";}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",render);}else{render();}document.addEventListener("pjax:complete",function(){setTimeout(render,0);});})();</script>'
